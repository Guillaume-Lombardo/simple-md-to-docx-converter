# Published Next.js cutover overlay. CI may override these defaults with exact
# locally staged identities; public quickstarts use the verified release pair.
services:
  markweave:
    image: "${MARKWEAVE_CUTOVER_BACKEND_IMAGE:-ghcr.io/guillaume-lombardo/md-converter:0.6.1@sha256:f8541a990237a60ffdbc2f33367921faafa2acd54007daa3c38e15e4b91120ea}"
    ports: !reset []

  frontend:
    image: "${MARKWEAVE_CUTOVER_FRONTEND_IMAGE:-ghcr.io/guillaume-lombardo/md-converter-web:0.6.1@sha256:800e16eaf00f7e258466f77b789f58554fd9e55f228e2d5ea10f3de1b5ab042e}"
    platform: linux/amd64
    depends_on:
      markweave:
        condition: service_healthy
    networks:
      - frontend
    environment:
      HOSTNAME: 0.0.0.0
    read_only: true
    user: "1001:0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/_frontend/health/ready')
          .then(response => process.exit(response.status === 200 ? 0 : 1))
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  router:
    image: "${MARKWEAVE_CUTOVER_FRONTEND_IMAGE:-ghcr.io/guillaume-lombardo/md-converter-web:0.6.1@sha256:800e16eaf00f7e258466f77b789f58554fd9e55f228e2d5ea10f3de1b5ab042e}"
    platform: linux/amd64
    command: [node, router.mjs]
    depends_on:
      frontend:
        condition: service_healthy
      markweave:
        condition: service_healthy
    environment:
      BACKEND_ORIGIN: http://markweave:8080
      FRONTEND_ORIGIN: http://frontend:3000
      PUBLIC_HOSTS: "${MARKWEAVE_ROUTER_PUBLIC_HOST:-localhost:${MARKWEAVE_PORT:-8080},127.0.0.1:${MARKWEAVE_PORT:-8080}}"
      ROUTER_HOST: 0.0.0.0
      ROUTER_PORT: "8080"
      ROUTER_REQUEST_MAX_BYTES: "1100000"
      ROUTER_UPSTREAM_TIMEOUT_MS: "30000"
    ports:
      - "127.0.0.1:${MARKWEAVE_PORT:-8080}:8080"
    networks:
      - frontend
    read_only: true
    user: "1001:0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8080/login',
          {headers: {Host: process.env.PUBLIC_HOSTS.split(',')[0]}})
          .then(response => process.exit(response.status === 200 ? 0 : 1))
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
