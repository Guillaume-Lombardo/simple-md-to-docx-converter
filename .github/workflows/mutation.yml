name: Mutation testing

on:
  pull_request:
  schedule:
    - cron: "43 4 * * 2"
  workflow_dispatch:
    inputs:
      domain:
        description: Reviewed critical mutation domain
        required: true
        type: choice
        default: all
        options:
          - all
          - observability
          - auth-session
          - archive-svg
          - job-integrity
          - retention-storage

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Mutation / critical gate
    if: ${{ github.repository == 'Guillaume-Lombardo/simple-md-to-docx-converter' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out pull-request mutation target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out trusted mutation policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          path: .mutation-policy
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: false
      - name: Synchronize locked dependencies
        run: cd .mutation-policy && uv sync --locked --all-groups
      - name: Run reviewed critical mutation campaign
        env:
          MUTATION_EVENT: ${{ github.event_name }}
          MUTATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MUTATION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MUTATION_DOMAIN: ${{ inputs.domain || 'all' }}
        run: |
          set -euo pipefail
          if [[ "$MUTATION_EVENT" == "pull_request" ]]; then
            uv run --directory .mutation-policy python scripts/ci/run_mutation_campaign.py \
              --mode changed \
              --base-sha "$MUTATION_BASE_SHA" \
              --head-sha "$MUTATION_HEAD_SHA" \
              --target-root "$GITHUB_WORKSPACE" \
              --artifact "$GITHUB_WORKSPACE/mutation-results/report.json"
          else
            uv run --directory .mutation-policy python scripts/ci/run_mutation_campaign.py \
              --mode "$MUTATION_DOMAIN" \
              --target-root "$GITHUB_WORKSPACE" \
              --artifact "$GITHUB_WORKSPACE/mutation-results/report.json"
          fi
      - name: Retain critical mutation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: critical-mutation-evidence
          path: mutation-results/report.json
          if-no-files-found: error
          retention-days: 14
