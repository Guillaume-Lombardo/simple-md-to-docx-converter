name: Reusable release compile canary

on:
  pull_request:
    paths:
      - .github/workflows/container-release.yml
      - .github/workflows/reusable-release-canary.yml

permissions:
  contents: read

jobs:
  compile:
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/container-release.yml
    with:
      version: "0.0.0"
      tag: v0.0.0
      source-sha: ${{ github.event.pull_request.head.sha }}
