name: Container release

on:
  workflow_call:
    inputs:
      artifact-run-id:
        required: false
        type: string
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      source-sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      artifact-run-id:
        description: Successful build run retaining the exact container artifact
        required: true
        type: string
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      source-sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.repository == 'Guillaume-Lombardo/simple-md-to-docx-converter' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.sha == inputs.source-sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      backend-digest: ${{ steps.push.outputs.backend-digest }}
      frontend-digest: ${{ steps.push.outputs.frontend-digest }}
      reverse-attempt-digest: ${{ steps.push.outputs.reverse-attempt-digest }}
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.1"
          enable-cache: false
      - name: Validate the reviewed release identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          uv run python -c 'import os, tomllib; assert tomllib.load(open("pyproject.toml", "rb"))["project"]["version"] == os.environ["RELEASE_VERSION"]'
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '[.tag_name, .target_commitish, .draft, .prerelease] | @tsv')" \
            = "$RELEASE_TAG"$'\t'"$SOURCE_SHA"$'\tfalse\tfalse'
      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups
      - name: Install rootless Podman and Skopeo
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes podman skopeo
          podman info --format '{{.Host.Security.Rootless}}' | grep -Fx true
          skopeo --version
      - name: Download the qualified staged image set
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-stage-${{ inputs.tag }}
          path: artifacts/container
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the bound pair without overwriting a conflicting image
        id: push
        env:
          GHCR_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          set -euo pipefail
          bash scripts/container/publish-release-pair.sh \
            artifacts/container "$RELEASE_VERSION" "$SOURCE_SHA"
      - name: Retain exact release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-release-${{ inputs.tag }}
          path: |
            artifacts/container/backend/
            artifacts/container/frontend/
            artifacts/container/reverse_attempt/
            artifacts/container/release-images.json
            artifacts/container/release-images.sha256
          if-no-files-found: error
          retention-days: 90

  recover-evidence:
    if: ${{ github.repository == 'Guillaume-Lombardo/simple-md-to-docx-converter' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      backend-digest: ${{ steps.push.outputs.backend-digest }}
      frontend-digest: ${{ steps.push.outputs.frontend-digest }}
      reverse-attempt-digest: ${{ steps.push.outputs.reverse-attempt-digest }}
    steps:
      - name: Check out the trusted recovery implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.1"
          enable-cache: false
      - name: Synchronize locked recovery dependencies
        run: uv sync --locked --all-groups
      - name: Validate release, source run, artifact, and public image identity
        id: identity
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact-run-id }}
          EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" != 0000000000000000000000000000000000000000
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"

          git show "$SOURCE_SHA:pyproject.toml" > "$RUNNER_TEMP/release-pyproject.toml"
          RELEASE_PYPROJECT="$RUNNER_TEMP/release-pyproject.toml" uv run python -c 'import os, tomllib; assert tomllib.load(open(os.environ["RELEASE_PYPROJECT"], "rb"))["project"]["version"] == os.environ["RELEASE_VERSION"]'
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '[.tag_name, .target_commitish, .draft, .prerelease] | @tsv')" \
            = "$RELEASE_TAG"$'\t'"$SOURCE_SHA"$'\tfalse\tfalse'

          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/container-release.yml" --jq .id)"
          release_workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml" --jq .id)"
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID")"
          jq --exit-status \
            --argjson repository_id "$EXPECTED_REPOSITORY_ID" \
            --argjson run_id "$ARTIFACT_RUN_ID" \
            --argjson workflow_id "$workflow_id" \
            --argjson release_workflow_id "$release_workflow_id" \
            '.id == $run_id and .repository.id == $repository_id and .head_repository.id == $repository_id and ((.workflow_id == $workflow_id and .path == ".github/workflows/container-release.yml" and .event == "workflow_dispatch") or (.workflow_id == $release_workflow_id and .path == ".github/workflows/release.yml" and .event == "push")) and .head_branch == "main" and .status == "completed" and .conclusion == "failure"' \
            <<< "$run_json" >/dev/null
          run_sha="$(jq --exit-status --raw-output '.head_sha | select(test("^[0-9a-f]{40}$"))' <<< "$run_json")"
          git merge-base --is-ancestor "$SOURCE_SHA" "$run_sha"
          git merge-base --is-ancestor "$run_sha" "$GITHUB_SHA"

          jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID/jobs")"
          test "$(jq '[.jobs[] | select(.name == "container-qualify / supply-chain" and .status == "completed" and ([.steps[] | select(.name == "Retain staged pair before registry mutation" and .status == "completed" and .conclusion == "success")] | length) == 1)] | length' <<< "$jobs_json")" = 1
          test "$(jq '[.jobs[] | select((.name | startswith("container-qualify / ")) and .conclusion == "success")] | length' <<< "$jobs_json")" = 7
          test "$(jq '[.jobs[] | select((.name | startswith("container-qualify / ")) and .conclusion != "success")] | length' <<< "$jobs_json")" = 0
          artifact_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID/artifacts" \
            | jq --exit-status --arg name "container-stage-$RELEASE_TAG" \
              '[.artifacts[] | select(.name == $name)] | if length == 1 then .[0] else error("expected one exact staged-pair artifact") end')"
          jq --exit-status \
            --argjson repository_id "$EXPECTED_REPOSITORY_ID" \
            --argjson run_id "$ARTIFACT_RUN_ID" \
            --arg run_sha "$run_sha" \
            '.expired == false and .size_in_bytes > 0 and .size_in_bytes <= 4000000000 and .workflow_run.id == $run_id and .workflow_run.repository_id == $repository_id and .workflow_run.head_repository_id == $repository_id and .workflow_run.head_sha == $run_sha' \
            <<< "$artifact_json" >/dev/null
          artifact_id="$(jq --exit-status --raw-output '.id | select(. > 0)' <<< "$artifact_json")"
          printf 'artifact-id=%s\n' "$artifact_id" >> "$GITHUB_OUTPUT"
      - name: Install rootless Podman and Skopeo for exact-byte recovery
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes podman skopeo
          podman info --format '{{.Host.Security.Rootless}}' | grep -Fx true
          skopeo --version
      - name: Download the exact retained artifact by immutable ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.identity.outputs.artifact-id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact-run-id }}
          path: artifacts/container
      - name: Recover or verify the exact retained pair publication
        id: push
        env:
          GHCR_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          set -euo pipefail
          if git cat-file -e "$SOURCE_SHA:pnpm-lock.yaml" 2>/dev/null; then
            git show "$SOURCE_SHA:pnpm-lock.yaml" > "$RUNNER_TEMP/release-frontend-lock.yaml"
          else
            git show "$SOURCE_SHA:web/package-lock.json" > "$RUNNER_TEMP/release-frontend-lock.yaml"
          fi
          git show "$SOURCE_SHA:scripts/container/release_pair.py" > "$RUNNER_TEMP/release-image-source.py"
          schema="$(uv run python -m scripts.container.release_pair source-schema --source-module "$RUNNER_TEMP/release-image-source.py")"
          recovery_options=()
          if [[ "$schema" = 1 ]]; then recovery_options=(--recover-legacy-pair); fi
          bash scripts/container/publish-release-pair.sh \
            artifacts/container "$RELEASE_VERSION" "$SOURCE_SHA" \
            "$RUNNER_TEMP/release-frontend-lock.yaml" "${recovery_options[@]}"
      - name: Verify retained bundle integrity and release identity
        env:
          BACKEND_DIGEST: ${{ steps.push.outputs.backend-digest }}
          FRONTEND_DIGEST: ${{ steps.push.outputs.frontend-digest }}
          REVERSE_ATTEMPT_DIGEST: ${{ steps.push.outputs.reverse-attempt-digest }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          set -euo pipefail
          verify_options=()
          if [[ -n "$REVERSE_ATTEMPT_DIGEST" ]]; then
            verify_options=(--reverse-attempt-registry-digest "$REVERSE_ATTEMPT_DIGEST")
          fi
          uv run python -m scripts.container.release_pair verify \
            --artifacts artifacts/container \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --source-sha "$SOURCE_SHA" \
            --frontend-lock-sha256 "$(sha256sum "$RUNNER_TEMP/release-frontend-lock.yaml" | cut -d' ' -f1)" \
            --backend-registry-digest "$BACKEND_DIGEST" \
            --frontend-registry-digest "$FRONTEND_DIGEST" \
            "${verify_options[@]}"
      - name: Transfer the exact verified evidence to this recovery run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-release-${{ inputs.tag }}
          path: |
            artifacts/container/backend/
            artifacts/container/frontend/
            artifacts/container/reverse_attempt/
            artifacts/container/release-images.json
            artifacts/container/release-images.sha256
          if-no-files-found: error
          retention-days: 90

  attest:
    needs: [publish, recover-evidence]
    if: ${{ always() && github.repository == 'Guillaume-Lombardo/simple-md-to-docx-converter' && github.ref == 'refs/heads/main' && ((github.event_name == 'push' && github.sha == inputs.source-sha && needs.publish.result == 'success') || (github.event_name == 'workflow_dispatch' && needs.recover-evidence.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Log in to GHCR for attestation publication
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Attest the published backend image identity
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/guillaume-lombardo/md-converter
          subject-digest: ${{ needs.publish.outputs.backend-digest || needs.recover-evidence.outputs.backend-digest }}
          push-to-registry: true
      - name: Attest the published frontend image identity
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/guillaume-lombardo/md-converter-web
          subject-digest: ${{ needs.publish.outputs.frontend-digest || needs.recover-evidence.outputs.frontend-digest }}
          push-to-registry: true

      - name: Attest the published reverse-attempt image identity
        if: ${{ needs.publish.outputs.reverse-attempt-digest != '' || needs.recover-evidence.outputs.reverse-attempt-digest != '' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/guillaume-lombardo/md-converter-reverse-attempt
          subject-digest: ${{ needs.publish.outputs.reverse-attempt-digest || needs.recover-evidence.outputs.reverse-attempt-digest }}
          push-to-registry: true

  release-evidence:
    needs: [publish, recover-evidence, attest]
    if: ${{ always() && github.repository == 'Guillaume-Lombardo/simple-md-to-docx-converter' && github.ref == 'refs/heads/main' && needs.attest.result == 'success' && ((github.event_name == 'push' && github.sha == inputs.source-sha && needs.publish.result == 'success') || (github.event_name == 'workflow_dispatch' && needs.recover-evidence.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-release-${{ inputs.tag }}
          path: artifacts/container
      - name: Verify the exact published Release and attach evidence idempotently
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          REVERSE_ATTEMPT_DIGEST: ${{ needs.publish.outputs.reverse-attempt-digest || needs.recover-evidence.outputs.reverse-attempt-digest }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '[.tag_name, .target_commitish, .draft, .prerelease] | @tsv')" \
            = "$RELEASE_TAG"$'\t'"$SOURCE_SHA"$'\tfalse\tfalse'
          release_assets="$RUNNER_TEMP/release-assets"
          mkdir "$release_assets"
          roles=(backend frontend)
          if [[ -n "$REVERSE_ATTEMPT_DIGEST" ]]; then roles+=(reverse_attempt); fi
          for role in "${roles[@]}"; do
            for name in sbom.cdx.json sbom.spdx.json vulnerabilities.json image-metadata.json registry-publication.json release-bundle.sha256; do
              cp -- "artifacts/container/$role/$name" "$release_assets/$role-$name"
            done
          done
          if [[ -n "$REVERSE_ATTEMPT_DIGEST" ]]; then
            for name in anydoc-cargo.cdx.json anydoc-cargo-vulnerabilities.json; do
              cp -- "artifacts/container/reverse_attempt/$name" "$release_assets/reverse_attempt-$name"
            done
          fi
          gh release upload "$RELEASE_TAG" \
            "$release_assets"/* \
            artifacts/container/release-images.json \
            artifacts/container/release-images.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
