name: Container release

on:
  workflow_call:
    inputs:
      artifact-run-id:
        required: false
        type: string
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      source-sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      artifact-run-id:
        description: Successful build run retaining the exact container artifact
        required: true
        type: string
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      source-sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-publish:
    if: ${{ github.repository == 'Guillaume-Lombardo/simple-md-to-docx-converter' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.sha == inputs.source-sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      backend-digest: ${{ steps.push.outputs.backend-digest }}
      frontend-digest: ${{ steps.push.outputs.frontend-digest }}
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: false
      - name: Set up pinned Node for the frontend image
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          check-latest: false
      - name: Validate the reviewed release identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          uv run python -c 'import os, tomllib; assert tomllib.load(open("pyproject.toml", "rb"))["project"]["version"] == os.environ["RELEASE_VERSION"]'
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '[.tag_name, .target_commitish, .draft, .prerelease] | @tsv')" \
            = "$RELEASE_TAG"$'\t'"$SOURCE_SHA"$'\tfalse\tfalse'
      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups
      - name: Install rootless Podman and Skopeo
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes podman skopeo
          podman info --format '{{.Host.Security.Rootless}}' | grep -Fx true
          skopeo --version
      - name: Pull and verify the pinned base image
        run: |
          set -euo pipefail
          base=registry.access.redhat.com/ubi9/python-314@sha256:194df4e35e0e5467e1b57266f4d61f821e1b1f567135f074d23066d3604ae653
          podman pull --quiet "$base"
          test "$(podman image inspect "$base" --format '{{.Digest}}')" = sha256:194df4e35e0e5467e1b57266f4d61f821e1b1f567135f074d23066d3604ae653
      - name: Build and validate the final rootless image pair once
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          backend_image="localhost/md-converter:$RELEASE_VERSION"
          frontend_image="localhost/md-converter-web:$RELEASE_VERSION"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          SOURCE_DATE_EPOCH="$source_date_epoch" bash scripts/container/build.sh "$backend_image"
          podman build --format oci --timestamp "$source_date_epoch" \
            --tag "$frontend_image" --file web/Containerfile web
          bash scripts/container/smoke.sh "$backend_image"
          bash scripts/container/api-smoke.sh "$backend_image"
          bash scripts/container/distributed-api-smoke.sh "$backend_image"
          bash scripts/container/recovery-cli-smoke.sh "$backend_image"
          bash web/scripts/run-rootless-smoke.sh "$frontend_image" --existing
      - name: Generate and verify release SBOM evidence for both images
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bash scripts/container/supply-chain.sh \
            "localhost/md-converter:$RELEASE_VERSION" artifacts/container/backend release
          bash scripts/container/supply-chain.sh \
            "localhost/md-converter-web:$RELEASE_VERSION" artifacts/container/frontend release
      - name: Test the exact staged image pair in both storage profiles
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          export MARKWEAVE_E2E_LOCAL_IMAGE="localhost/md-converter:$RELEASE_VERSION"
          export MARKWEAVE_E2E_LOCAL_FRONTEND_IMAGE="localhost/md-converter-web:$RELEASE_VERSION"
          bash scripts/e2e/run.sh standalone
          bash scripts/e2e/run.sh distributed
      - name: Retain staged pair before registry mutation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-stage-${{ inputs.tag }}
          path: |
            artifacts/container/backend/
            artifacts/container/frontend/
          if-no-files-found: error
          retention-days: 90
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the bound pair without overwriting a conflicting image
        id: push
        env:
          GHCR_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          set -euo pipefail
          bash scripts/container/publish-release-pair.sh \
            artifacts/container "$RELEASE_VERSION" "$SOURCE_SHA"
      - name: Retain exact release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-release-${{ inputs.tag }}
          path: |
            artifacts/container/backend/
            artifacts/container/frontend/
            artifacts/container/release-images.json
            artifacts/container/release-images.sha256
          if-no-files-found: error
          retention-days: 90

  recover-evidence:
    if: ${{ github.repository == 'Guillaume-Lombardo/simple-md-to-docx-converter' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      backend-digest: ${{ steps.push.outputs.backend-digest }}
      frontend-digest: ${{ steps.push.outputs.frontend-digest }}
    steps:
      - name: Check out the trusted recovery implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: false
      - name: Synchronize locked recovery dependencies
        run: uv sync --locked --all-groups
      - name: Validate release, source run, artifact, and public image identity
        id: identity
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact-run-id }}
          EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" != 0000000000000000000000000000000000000000
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"

          git show "$SOURCE_SHA:pyproject.toml" > "$RUNNER_TEMP/release-pyproject.toml"
          RELEASE_PYPROJECT="$RUNNER_TEMP/release-pyproject.toml" uv run python -c 'import os, tomllib; assert tomllib.load(open(os.environ["RELEASE_PYPROJECT"], "rb"))["project"]["version"] == os.environ["RELEASE_VERSION"]'
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '[.tag_name, .target_commitish, .draft, .prerelease] | @tsv')" \
            = "$RELEASE_TAG"$'\t'"$SOURCE_SHA"$'\tfalse\tfalse'

          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/container-release.yml" --jq .id)"
          release_workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml" --jq .id)"
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID")"
          jq --exit-status \
            --argjson repository_id "$EXPECTED_REPOSITORY_ID" \
            --argjson run_id "$ARTIFACT_RUN_ID" \
            --argjson workflow_id "$workflow_id" \
            --argjson release_workflow_id "$release_workflow_id" \
            '.id == $run_id and .repository.id == $repository_id and .head_repository.id == $repository_id and ((.workflow_id == $workflow_id and .path == ".github/workflows/container-release.yml" and .event == "workflow_dispatch") or (.workflow_id == $release_workflow_id and .path == ".github/workflows/release.yml" and .event == "push")) and .head_branch == "main" and .status == "completed" and .conclusion == "failure"' \
            <<< "$run_json" >/dev/null
          run_sha="$(jq --exit-status --raw-output '.head_sha | select(test("^[0-9a-f]{40}$"))' <<< "$run_json")"
          git merge-base --is-ancestor "$SOURCE_SHA" "$run_sha"
          git merge-base --is-ancestor "$run_sha" "$GITHUB_SHA"

          jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID/jobs")"
          test "$(jq '[.jobs[] | select((.name == "build-and-publish" or (.name | endswith(" / build-and-publish"))) and .status == "completed" and ([.steps[] | select(.name == "Retain staged pair before registry mutation" and .status == "completed" and .conclusion == "success")] | length) == 1)] | length' <<< "$jobs_json")" = 1
          artifact_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID/artifacts" \
            | jq --exit-status --arg name "container-stage-$RELEASE_TAG" \
              '[.artifacts[] | select(.name == $name)] | if length == 1 then .[0] else error("expected one exact staged-pair artifact") end')"
          jq --exit-status \
            --argjson repository_id "$EXPECTED_REPOSITORY_ID" \
            --argjson run_id "$ARTIFACT_RUN_ID" \
            --arg run_sha "$run_sha" \
            '.expired == false and .size_in_bytes > 0 and .size_in_bytes <= 4000000000 and .workflow_run.id == $run_id and .workflow_run.repository_id == $repository_id and .workflow_run.head_repository_id == $repository_id and .workflow_run.head_sha == $run_sha' \
            <<< "$artifact_json" >/dev/null
          artifact_id="$(jq --exit-status --raw-output '.id | select(. > 0)' <<< "$artifact_json")"
          printf 'artifact-id=%s\n' "$artifact_id" >> "$GITHUB_OUTPUT"
      - name: Install rootless Podman and Skopeo for exact-byte recovery
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes podman skopeo
          podman info --format '{{.Host.Security.Rootless}}' | grep -Fx true
          skopeo --version
      - name: Download the exact retained artifact by immutable ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.identity.outputs.artifact-id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact-run-id }}
          path: artifacts/container
      - name: Recover or verify the exact retained pair publication
        id: push
        env:
          GHCR_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          set -euo pipefail
          git show "$SOURCE_SHA:web/package-lock.json" > "$RUNNER_TEMP/release-package-lock.json"
          bash scripts/container/publish-release-pair.sh \
            artifacts/container "$RELEASE_VERSION" "$SOURCE_SHA" \
            "$RUNNER_TEMP/release-package-lock.json"
      - name: Verify retained bundle integrity and release identity
        env:
          BACKEND_DIGEST: ${{ steps.push.outputs.backend-digest }}
          FRONTEND_DIGEST: ${{ steps.push.outputs.frontend-digest }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: >-
          uv run python -m scripts.container.release_pair verify
          --artifacts artifacts/container
          --version "$RELEASE_VERSION"
          --tag "$RELEASE_TAG"
          --source-sha "$SOURCE_SHA"
          --frontend-lock-sha256 "$(git show "$SOURCE_SHA:web/package-lock.json" | sha256sum | cut -d' ' -f1)"
          --backend-registry-digest "$BACKEND_DIGEST"
          --frontend-registry-digest "$FRONTEND_DIGEST"
      - name: Transfer the exact verified evidence to this recovery run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-release-${{ inputs.tag }}
          path: |
            artifacts/container/backend/
            artifacts/container/frontend/
            artifacts/container/release-images.json
            artifacts/container/release-images.sha256
          if-no-files-found: error
          retention-days: 90

  attest:
    needs: [build-and-publish, recover-evidence]
    if: ${{ always() && github.repository == 'Guillaume-Lombardo/simple-md-to-docx-converter' && github.ref == 'refs/heads/main' && ((github.event_name == 'push' && github.sha == inputs.source-sha && needs.build-and-publish.result == 'success') || (github.event_name == 'workflow_dispatch' && needs.recover-evidence.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Log in to GHCR for attestation publication
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Attest the published backend image identity
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/guillaume-lombardo/md-converter
          subject-digest: ${{ needs.build-and-publish.outputs.backend-digest || needs.recover-evidence.outputs.backend-digest }}
          push-to-registry: true
      - name: Attest the published frontend image identity
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/guillaume-lombardo/md-converter-web
          subject-digest: ${{ needs.build-and-publish.outputs.frontend-digest || needs.recover-evidence.outputs.frontend-digest }}
          push-to-registry: true

  release-evidence:
    needs: [build-and-publish, recover-evidence, attest]
    if: ${{ always() && github.repository == 'Guillaume-Lombardo/simple-md-to-docx-converter' && github.ref == 'refs/heads/main' && needs.attest.result == 'success' && ((github.event_name == 'push' && github.sha == inputs.source-sha && needs.build-and-publish.result == 'success') || (github.event_name == 'workflow_dispatch' && needs.recover-evidence.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: container-release-${{ inputs.tag }}
          path: artifacts/container
      - name: Verify the exact published Release and attach evidence idempotently
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '[.tag_name, .target_commitish, .draft, .prerelease] | @tsv')" \
            = "$RELEASE_TAG"$'\t'"$SOURCE_SHA"$'\tfalse\tfalse'
          release_assets="$RUNNER_TEMP/release-assets"
          mkdir "$release_assets"
          for role in backend frontend; do
            for name in sbom.cdx.json sbom.spdx.json vulnerabilities.json image-metadata.json registry-publication.json release-bundle.sha256; do
              cp -- "artifacts/container/$role/$name" "$release_assets/$role-$name"
            done
          done
          gh release upload "$RELEASE_TAG" \
            "$release_assets"/* \
            artifacts/container/release-images.json \
            artifacts/container/release-images.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
