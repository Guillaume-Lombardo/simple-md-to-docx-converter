name: Container release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      source-sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      artifact-run-id:
        description: Successful build run retaining the exact container artifact
        required: true
        type: string
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      source-sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-publish:
    if: ${{ github.repository == 'Guillaume-Lombardo/simple-md-to-docx-converter' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.sha == inputs.source-sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: false
      - name: Validate the reviewed release identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          uv run python -c 'import os, tomllib; assert tomllib.load(open("pyproject.toml", "rb"))["project"]["version"] == os.environ["RELEASE_VERSION"]'
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '[.tag_name, .target_commitish, .draft, .prerelease] | @tsv')" \
            = "$RELEASE_TAG"$'\t'"$SOURCE_SHA"$'\tfalse\tfalse'
      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups
      - name: Install rootless Podman and Skopeo
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes podman skopeo
          podman info --format '{{.Host.Security.Rootless}}' | grep -Fx true
          skopeo --version
      - name: Pull and verify the pinned base image
        run: |
          set -euo pipefail
          base=registry.access.redhat.com/ubi9/python-314@sha256:194df4e35e0e5467e1b57266f4d61f821e1b1f567135f074d23066d3604ae653
          podman pull --quiet "$base"
          test "$(podman image inspect "$base" --format '{{.Digest}}')" = sha256:194df4e35e0e5467e1b57266f4d61f821e1b1f567135f074d23066d3604ae653
      - name: Build and validate the final rootless image
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          image="localhost/md-converter:$RELEASE_VERSION"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" bash scripts/container/build.sh "$image"
          bash scripts/container/smoke.sh "$image"
          bash scripts/container/api-smoke.sh "$image"
          bash scripts/container/distributed-api-smoke.sh "$image"
      - name: Generate and verify release SBOM evidence
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: bash scripts/container/supply-chain.sh "localhost/md-converter:$RELEASE_VERSION" artifacts/container release
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish without overwriting a conflicting release image
        id: push
        env:
          GHCR_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          set -euo pipefail
          registry_repository="ghcr.io/guillaume-lombardo/md-converter"
          registry_path="guillaume-lombardo/md-converter"
          source_tag="source-$SOURCE_SHA"
          registry_stage="$(mktemp -d "$RUNNER_TEMP/registry-stage.XXXXXX")"
          chmod 700 "$registry_stage"
          cleanup() {
            rm -rf -- "$registry_stage"
          }
          trap cleanup EXIT
          podman push --format oci --digestfile "$RUNNER_TEMP/staged-image-digest" \
            "localhost/md-converter:$RELEASE_VERSION" "dir:$registry_stage"
          intended_digest="$(cat "$RUNNER_TEMP/staged-image-digest")"
          [[ "$intended_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          staged_manifest_digest="sha256:$(sha256sum "$registry_stage/manifest.json" | cut -d' ' -f1)"
          test "$staged_manifest_digest" = "$intended_digest"
          registry_token="$(curl --fail --silent --show-error \
            --user "$GITHUB_ACTOR:$GHCR_TOKEN" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:$registry_path:pull,push" \
            | jq --exit-status --raw-output '.token // .access_token')"

          inspect_remote_tag() {
            local tag="$1"
            local headers="$RUNNER_TEMP/registry-headers"
            local status
            if ! status="$(curl --silent --show-error --output /dev/null \
              --dump-header "$headers" --write-out '%{http_code}' \
              --header "Authorization: Bearer $registry_token" \
              --header 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/$registry_path/manifests/$tag")"; then
              return 5
            fi
            if [[ "$status" = 404 ]]; then
              return 4
            fi
            [[ "$status" = 200 ]] || return 5
            local digest
            digest="$(awk -F ': ' 'tolower($1) == "docker-content-digest" {gsub("\\r", "", $2); print $2}' "$headers")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || return 5
            printf '%s\n' "$digest"
          }
          copy_staged_tag() {
            local tag="$1"
            local copy_status
            local copied_digest
            local inspect_status
            if skopeo copy --preserve-digests --retry-times 3 \
              "dir:$registry_stage" "docker://$registry_repository:$tag"; then
              copy_status=0
            else
              copy_status="$?"
            fi
            if copied_digest="$(inspect_remote_tag "$tag")"; then
              if [[ "$copied_digest" = "$intended_digest" ]]; then
                if [[ "$copy_status" != 0 ]]; then
                  echo "Skopeo returned $copy_status after GHCR stored the exact expected manifest for $tag; accepting the verified registry postcondition." >&2
                fi
                return 0
              fi
              echo "GHCR tag $tag resolves to unexpected digest $copied_digest after copy." >&2
              return 1
            else
              inspect_status="$?"
              echo "GHCR tag $tag could not be verified after Skopeo returned $copy_status (inspection status $inspect_status)." >&2
              return 1
            fi
          }

          if remote_digest="$(inspect_remote_tag "$source_tag")"; then
            test "$remote_digest" = "$intended_digest"
          else
            test "$?" = 4
            copy_staged_tag "$source_tag"
            test "$(inspect_remote_tag "$source_tag")" = "$intended_digest"
          fi

          if remote_digest="$(inspect_remote_tag "$RELEASE_VERSION")"; then
            test "$remote_digest" = "$intended_digest"
          else
            test "$?" = 4
            copy_staged_tag "$RELEASE_VERSION"
            test "$(inspect_remote_tag "$RELEASE_VERSION")" = "$intended_digest"
          fi
          archive_digest="$(jq --exit-status --raw-output '.image.oci_manifest_digest' artifacts/container/image-metadata.json)"
          [[ "$archive_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq --null-input \
            --arg archive_digest "$archive_digest" \
            --arg registry_digest "$intended_digest" \
            --arg source_sha "$SOURCE_SHA" \
            --arg version "$RELEASE_VERSION" \
            '{oci_archive_manifest_digest: $archive_digest, registry_manifest_digest: $registry_digest, source_sha: $source_sha, version: $version}' \
            > artifacts/container/registry-publication.json
          printf 'digest=%s\n' "$intended_digest" >> "$GITHUB_OUTPUT"
      - name: Retain exact release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-release-${{ inputs.tag }}
          path: |
            artifacts/container/image.oci.tar
            artifacts/container/sbom.cdx.json
            artifacts/container/sbom.spdx.json
            artifacts/container/vulnerabilities.json
            artifacts/container/image-metadata.json
            artifacts/container/registry-publication.json
            artifacts/container/release-bundle.sha256
          if-no-files-found: error
          retention-days: 90

  recover-evidence:
    if: ${{ github.repository == 'Guillaume-Lombardo/simple-md-to-docx-converter' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      digest: ${{ steps.identity.outputs.digest }}
    steps:
      - name: Check out the trusted recovery implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: false
      - name: Synchronize locked recovery dependencies
        run: uv sync --locked --all-groups
      - name: Validate release, source run, artifact, and public image identity
        id: identity
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact-run-id }}
          EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" != 0000000000000000000000000000000000000000
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"

          git show "$SOURCE_SHA:pyproject.toml" > "$RUNNER_TEMP/release-pyproject.toml"
          RELEASE_PYPROJECT="$RUNNER_TEMP/release-pyproject.toml" uv run python -c 'import os, tomllib; assert tomllib.load(open(os.environ["RELEASE_PYPROJECT"], "rb"))["project"]["version"] == os.environ["RELEASE_VERSION"]'
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '[.tag_name, .target_commitish, .draft, .prerelease] | @tsv')" \
            = "$RELEASE_TAG"$'\t'"$SOURCE_SHA"$'\tfalse\tfalse'

          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/container-release.yml" --jq .id)"
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID")"
          jq --exit-status \
            --argjson repository_id "$EXPECTED_REPOSITORY_ID" \
            --argjson run_id "$ARTIFACT_RUN_ID" \
            --argjson workflow_id "$workflow_id" \
            '.id == $run_id and .repository.id == $repository_id and .head_repository.id == $repository_id and .workflow_id == $workflow_id and .path == ".github/workflows/container-release.yml" and .event == "workflow_dispatch" and .head_branch == "main" and .status == "completed" and .conclusion == "failure"' \
            <<< "$run_json" >/dev/null
          run_sha="$(jq --exit-status --raw-output '.head_sha | select(test("^[0-9a-f]{40}$"))' <<< "$run_json")"
          git merge-base --is-ancestor "$SOURCE_SHA" "$run_sha"

          jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID/jobs")"
          test "$(jq '[.jobs[] | select(.name == "build-and-publish" and .status == "completed" and .conclusion == "success")] | length' <<< "$jobs_json")" = 1
          artifact_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID/artifacts" \
            | jq --exit-status --arg name "container-release-$RELEASE_TAG" \
              'if .total_count == 1 and (.artifacts | length) == 1 and .artifacts[0].name == $name then .artifacts[0] else error("expected the single retained artifact") end')"
          jq --exit-status \
            --argjson repository_id "$EXPECTED_REPOSITORY_ID" \
            --argjson run_id "$ARTIFACT_RUN_ID" \
            --arg run_sha "$run_sha" \
            '.expired == false and .size_in_bytes > 0 and .size_in_bytes <= 2000000000 and .workflow_run.id == $run_id and .workflow_run.repository_id == $repository_id and .workflow_run.head_repository_id == $repository_id and .workflow_run.head_sha == $run_sha' \
            <<< "$artifact_json" >/dev/null
          artifact_id="$(jq --exit-status --raw-output '.id | select(. > 0)' <<< "$artifact_json")"

          registry_path="guillaume-lombardo/md-converter"
          registry_token="$(curl --fail --silent --show-error \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:$registry_path:pull" \
            | jq --exit-status --raw-output '.token // .access_token')"
          public_headers="$RUNNER_TEMP/public-registry-headers"
          public_status="$(curl --silent --show-error --output /dev/null \
            --dump-header "$public_headers" --write-out '%{http_code}' \
            --header "Authorization: Bearer $registry_token" \
            --header 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/$registry_path/manifests/$RELEASE_VERSION")"
          test "$public_status" = 200
          public_digest="$(awk -F ': ' 'tolower($1) == "docker-content-digest" {gsub("\\r", "", $2); print $2}' "$public_headers")"
          [[ "$public_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'artifact-id=%s\ndigest=%s\n' "$artifact_id" "$public_digest" >> "$GITHUB_OUTPUT"
      - name: Download the exact retained artifact by immutable ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.identity.outputs.artifact-id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact-run-id }}
          path: artifacts/container
      - name: Verify retained bundle integrity and release identity
        env:
          PUBLIC_DIGEST: ${{ steps.identity.outputs.digest }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: >-
          uv run python -m scripts.container.recover_release_evidence
          --artifacts artifacts/container
          --version "$RELEASE_VERSION"
          --tag "$RELEASE_TAG"
          --source-sha "$SOURCE_SHA"
          --registry-digest "$PUBLIC_DIGEST"
      - name: Transfer the exact verified evidence to this recovery run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-release-${{ inputs.tag }}
          path: |
            artifacts/container/image.oci.tar
            artifacts/container/sbom.cdx.json
            artifacts/container/sbom.spdx.json
            artifacts/container/vulnerabilities.json
            artifacts/container/image-metadata.json
            artifacts/container/registry-publication.json
            artifacts/container/release-bundle.sha256
          if-no-files-found: error
          retention-days: 90

  attest:
    needs: [build-and-publish, recover-evidence]
    if: ${{ always() && github.repository == 'Guillaume-Lombardo/simple-md-to-docx-converter' && github.ref == 'refs/heads/main' && ((github.event_name == 'push' && github.sha == inputs.source-sha && needs.build-and-publish.result == 'success') || (github.event_name == 'workflow_dispatch' && needs.recover-evidence.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Log in to GHCR for attestation publication
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Attest the published image identity
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/guillaume-lombardo/md-converter
          subject-digest: ${{ needs.build-and-publish.outputs.digest || needs.recover-evidence.outputs.digest }}
          push-to-registry: true

  release-evidence:
    needs: [build-and-publish, recover-evidence, attest]
    if: ${{ always() && github.repository == 'Guillaume-Lombardo/simple-md-to-docx-converter' && github.ref == 'refs/heads/main' && needs.attest.result == 'success' && ((github.event_name == 'push' && github.sha == inputs.source-sha && needs.build-and-publish.result == 'success') || (github.event_name == 'workflow_dispatch' && needs.recover-evidence.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: container-release-${{ inputs.tag }}
          path: artifacts/container
      - name: Verify the exact published Release and attach evidence idempotently
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '[.tag_name, .target_commitish, .draft, .prerelease] | @tsv')" \
            = "$RELEASE_TAG"$'\t'"$SOURCE_SHA"$'\tfalse\tfalse'
          gh release upload "$RELEASE_TAG" \
            artifacts/container/sbom.cdx.json \
            artifacts/container/sbom.spdx.json \
            artifacts/container/vulnerabilities.json \
            artifacts/container/image-metadata.json \
            artifacts/container/registry-publication.json \
            artifacts/container/release-bundle.sha256 \
            --clobber
