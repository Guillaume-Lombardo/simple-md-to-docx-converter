name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      rerun_t67_benchmark:
        description: Rerun the network-sensitive T67 package-manager benchmark
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  detect:
    name: CI / detect domains
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      selected-domains: ${{ steps.select.outputs.selected-domains }}
      planned-domains: ${{ steps.select.outputs.planned-domains }}
      runnable-domains: ${{ steps.select.outputs.runnable-domains }}
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Select affected domains
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          IS_DRAFT: ${{ github.event.pull_request.draft || false }}
          COMPLETE_SUITE: ${{ github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          args=(
            --paths-file "$RUNNER_TEMP/changed-paths"
            --registry .github/ci/domains.json
            --github-output "$GITHUB_OUTPUT"
          )
          : > "$RUNNER_TEMP/changed-paths"
          if [[ "$COMPLETE_SUITE" != "true" ]]; then
            if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              git ls-files -z > "$RUNNER_TEMP/changed-paths"
            else
              git diff --name-only -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
            fi
          fi
          if [[ "$COMPLETE_SUITE" == "true" ]]; then
            args+=(--full)
          fi
          if [[ "$IS_DRAFT" == "true" ]]; then
            args+=(--draft)
          fi
          python -m scripts.ci.select_domains "${args[@]}"

  light:
    name: CI / light
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Set up pinned Node for browser and frontend tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          check-latest: false
      - name: Bootstrap verified Corepack and pnpm
        run: |
          set -euo pipefail
          scripts/javascript/bootstrap-pnpm.sh "$RUNNER_TEMP/markweave-js-tools"
          echo "$RUNNER_TEMP/markweave-js-tools/bin" >> "$GITHUB_PATH"
          echo "COREPACK_HOME=$RUNNER_TEMP/markweave-js-tools/corepack-home" >> "$GITHUB_ENV"
          echo "COREPACK_ENABLE_NETWORK=0" >> "$GITHUB_ENV"
      - name: Restore the exact pnpm store cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store/v11
          key: ${{ runner.os }}-node-24.19.0-pnpm-11.25.0-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Set up uv with a lock-keyed cache
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: py314
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Guillaume-Lombardo/simple-md-to-docx-converter' }}
      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups
      - name: Verify public release alignment
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          GHCR_TOKEN: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && github.token || '' }}
          GHCR_USERNAME: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && github.actor || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: >-
          uv run python -m scripts.release.public_alignment
          --event-name "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Check types
        run: uv run ty check
      - name: Validate the canonical OpenAPI contract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          uv run python -m scripts.openapi_contract check
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            uv run python -m scripts.openapi_contract compare --baseline-git-ref "$BASE_SHA"
          fi
      - name: Run native browser-module tests with coverage gates
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run workspace:check
          pnpm run test:web
      - name: Verify the workspace frontend
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(corepack --version)" = "0.36.0"
          test "$(pnpm --version)" = "11.25.0"
          pnpm --filter @markweave/web run check
          pnpm --filter @markweave/web run build
          pnpm --filter @markweave/web run test:production
      - name: Run unit tests with branch coverage
        run: >-
          uv run pytest -m unit
          --cov-report=json:coverage.json
      - name: Enforce application branch-only coverage
        run: >-
          uv run python -m scripts.ci.check_branch_coverage
          --coverage coverage.json --fail-under 90
      - name: Enforce changed application line coverage
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: >-
          uv run python -m scripts.ci.check_changed_coverage
          --base "$BASE_SHA" --head "$HEAD_SHA"
          --coverage coverage.json --source-root src/markweave --fail-under 90
      - name: Run cheap CI security checks
        run: |
          uv lock --check
          uv run python -m scripts.ci.validate_ci
      - name: Save the exact pnpm store cache from trusted main
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Guillaume-Lombardo/simple-md-to-docx-converter' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store/v11
          key: ${{ runner.os }}-node-24.19.0-pnpm-11.25.0-${{ hashFiles('pnpm-lock.yaml') }}

  domain-plan:
    name: CI / affected domains
    needs: detect
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report runnable and explicitly planned suites
        env:
          PLANNED_DOMAINS: ${{ needs.detect.outputs.planned-domains }}
          RUNNABLE_DOMAINS: ${{ needs.detect.outputs.runnable-domains }}
          SELECTED_DOMAINS: ${{ needs.detect.outputs.selected-domains }}
        run: |
          set -euo pipefail
          {
            echo "## Domain selection"
            echo
            echo "Selected: \`$SELECTED_DOMAINS\`"
            echo
            echo "Runnable: \`$RUNNABLE_DOMAINS\`"
            echo
            echo "Planned suites not treated as executed: \`$PLANNED_DOMAINS\`"
          } >> "$GITHUB_STEP_SUMMARY"

  heavy:
    name: CI / ${{ matrix.domain }}
    if: ${{ needs.detect.outputs.runnable-domains != '[]' }}
    needs: detect
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        domain: ${{ fromJSON(needs.detect.outputs.runnable-domains) }}
    services:
      postgres:
        image: ${{ matrix.domain == 'storage-distributed' && 'docker.io/library/postgres:18-alpine@sha256:63bdc97d67b5133bf0e5ebd500bec6d046fa851dc81340d838f0347e616107e8' || '' }}
        env:
          POSTGRES_DB: md_converter_test
          POSTGRES_PASSWORD: t12-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d md_converter_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
      rustfs:
        image: ${{ matrix.domain == 'storage-distributed' && 'ghcr.io/rustfs/rustfs:1.0.0-beta.12-glibc@sha256:6d693c8d0c09a1c5770f1780303a5d58b9e864c313fd2644ecd561e92b79ae04' || '' }}
        env:
          RUSTFS_ACCESS_KEY: t12integration
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_CONSOLE_ENABLE: false
          RUSTFS_SECRET_KEY: t12integrationsecret
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/health"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      MARKWEAVE_TEST_POSTGRES_URL: postgresql+psycopg://postgres:t12-ci-password@127.0.0.1:5432/md_converter_test
      MARKWEAVE_TEST_S3_ACCESS_KEY_ID: t12integration
      MARKWEAVE_TEST_S3_BUCKET: md-converter-t12
      MARKWEAVE_TEST_S3_ENDPOINT_URL: http://127.0.0.1:9000
      MARKWEAVE_TEST_S3_REGION: us-east-1
      MARKWEAVE_TEST_S3_SECRET_ACCESS_KEY: t12integrationsecret
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Set up pinned Node for frontend smoke
        if: ${{ matrix.domain == 'frontend' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          check-latest: false
      - name: Set up uv with a lock-keyed cache
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: py314-${{ matrix.domain }}
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Guillaume-Lombardo/simple-md-to-docx-converter' }}
      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups
      - name: Restore verified LibreOffice DEB archive
        if: ${{ matrix.domain == 'document-engines' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/markweave-toolchain/LibreOffice_26.2.5_Linux_x86-64_deb.tar.gz
          key: ubuntu-24.04-amd64-libreoffice-deb-26.2.5-2f03bfb2ac9f33ea7c77331b4b7a23300fb0ed7443566046bf8b5bc51c1bed1e
      - name: Prepare verified LibreOffice DEB archive
        if: ${{ matrix.domain == 'document-engines' }}
        env:
          MARKWEAVE_TOOLCHAIN_CACHE_DIRECTORY: ${{ runner.temp }}/markweave-toolchain
        run: bash scripts/ci/prepare-libreoffice-archive.sh deb
      - name: Save verified LibreOffice DEB archive
        if: ${{ matrix.domain == 'document-engines' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Guillaume-Lombardo/simple-md-to-docx-converter' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/markweave-toolchain/LibreOffice_26.2.5_Linux_x86-64_deb.tar.gz
          key: ubuntu-24.04-amd64-libreoffice-deb-26.2.5-2f03bfb2ac9f33ea7c77331b4b7a23300fb0ed7443566046bf8b5bc51c1bed1e
      - name: Restore verified LibreOffice RPM archive
        if: ${{ matrix.domain == 'container' || startsWith(matrix.domain, 'e2e-') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/markweave-toolchain/LibreOffice_26.2.5_Linux_x86-64_rpm.tar.gz
          key: ubuntu-24.04-amd64-libreoffice-rpm-26.2.5-f62611c441ff1faa5cadb499abdbab119f5a9013eb6c0e32fc9aa65f6ff8b53d
      - name: Prepare verified LibreOffice RPM archive
        if: ${{ matrix.domain == 'container' || startsWith(matrix.domain, 'e2e-') }}
        env:
          MARKWEAVE_TOOLCHAIN_CACHE_DIRECTORY: ${{ runner.temp }}/markweave-toolchain
        run: bash scripts/ci/prepare-libreoffice-archive.sh rpm
      - name: Save verified LibreOffice RPM archive
        if: ${{ matrix.domain == 'container' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Guillaume-Lombardo/simple-md-to-docx-converter' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/markweave-toolchain/LibreOffice_26.2.5_Linux_x86-64_rpm.tar.gz
          key: ubuntu-24.04-amd64-libreoffice-rpm-26.2.5-f62611c441ff1faa5cadb499abdbab119f5a9013eb6c0e32fc9aa65f6ff8b53d
      - name: Install rootless Podman for container validation
        if: ${{ matrix.domain == 'compose' || matrix.domain == 'container' || matrix.domain == 'frontend' || startsWith(matrix.domain, 'e2e-') }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes podman
          podman info --format '{{.Host.Security.Rootless}}' | grep -Fx true
      - name: Install verified Pandoc for document-engine tests
        if: ${{ matrix.domain == 'document-engines' }}
        env:
          PANDOC_SHA256: c7edd535941c48be6a362081a748272837de81ae11777202d9c341d3d8261c9a
          PANDOC_URL: https://github.com/jgm/pandoc/releases/download/3.10.2/pandoc-3.10.2-linux-amd64.tar.gz
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/pandoc-3.10.2-linux-amd64.tar.gz"
          install_root="$RUNNER_TEMP/pandoc-install"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --connect-timeout 20 --max-time 180 --retry 3 --retry-all-errors \
            --output "$archive" "$PANDOC_URL"
          echo "$PANDOC_SHA256  $archive" | sha256sum --check --strict
          mkdir --mode=0700 "$install_root"
          tar --extract --gzip --file="$archive" --directory="$install_root" \
            --no-same-owner --no-same-permissions
          pandoc_bin="$install_root/pandoc-3.10.2/bin"
          [[ -x "$pandoc_bin/pandoc" ]]
          echo "$pandoc_bin" >> "$GITHUB_PATH"
      - name: Install verified fonts and LibreOffice for document-engine tests
        if: ${{ matrix.domain == 'document-engines' }}
        env:
          LIBREOFFICE_SHA256: 2f03bfb2ac9f33ea7c77331b4b7a23300fb0ed7443566046bf8b5bc51c1bed1e
          MARKWEAVE_TOOLCHAIN_CACHE_DIRECTORY: ${{ runner.temp }}/markweave-toolchain
        run: |
          set -euo pipefail
          sudo bash spikes/toolchain/fonts/install-fonts.sh
          sudo install --directory --mode=0755 /opt/md-converter/fontconfig/cache
          sudo install --mode=0444 spikes/toolchain/fonts/fonts.conf \
            /opt/md-converter/fontconfig/fonts.conf
          sudo install --directory --mode=0755 /opt/toolchain/evidence
          sudo install --mode=0444 spikes/toolchain/fonts/manifest.json \
            /opt/toolchain/evidence/font-manifest.json
          sudo env FONTCONFIG_FILE=/opt/md-converter/fontconfig/fonts.conf fc-cache --force
          echo "FONTCONFIG_FILE=/opt/md-converter/fontconfig/fonts.conf" >> "$GITHUB_ENV"

          archive="$MARKWEAVE_TOOLCHAIN_CACHE_DIRECTORY/LibreOffice_26.2.5_Linux_x86-64_deb.tar.gz"
          install_root="$RUNNER_TEMP/libreoffice-install"
          echo "$LIBREOFFICE_SHA256  $archive" | sha256sum --check --strict
          mkdir --mode=0700 "$install_root"
          tar --extract --gzip --file="$archive" --directory="$install_root" \
            --no-same-owner --no-same-permissions
          sudo apt-get install --yes "$install_root"/LibreOffice_26.2.5.2_Linux_x86-64_deb/DEBS/*.deb
          echo "/opt/libreoffice26.2/program" >> "$GITHUB_PATH"
          test "$(FONTCONFIG_FILE=/opt/md-converter/fontconfig/fonts.conf \
            fc-list --format '%{file}\n' | wc -l)" -eq 32
          test "$(/opt/libreoffice26.2/program/soffice --version | awk '{$1=$1; print}')" \
            = "LibreOffice 26.2.5.2 cd7284b4cbbfeb507e630c1aac019f4157393acb"
      - name: Set up the pinned Node runtime for Mermaid tests
        if: ${{ matrix.domain == 'document-engines' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          check-latest: false
      - name: Set up pinned Node for rootless E2E
        if: ${{ startsWith(matrix.domain, 'e2e-') }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          check-latest: false
      - name: Bootstrap verified Corepack and pnpm for workspace domains
        if: ${{ matrix.domain == 'frontend' || startsWith(matrix.domain, 'e2e-') }}
        run: |
          set -euo pipefail
          scripts/javascript/bootstrap-pnpm.sh "$RUNNER_TEMP/markweave-js-tools"
          echo "$RUNNER_TEMP/markweave-js-tools/bin" >> "$GITHUB_PATH"
          echo "COREPACK_HOME=$RUNNER_TEMP/markweave-js-tools/corepack-home" >> "$GITHUB_ENV"
          echo "COREPACK_ENABLE_NETWORK=0" >> "$GITHUB_ENV"
      - name: Restore the exact pnpm store cache for workspace domains
        if: ${{ matrix.domain == 'frontend' || startsWith(matrix.domain, 'e2e-') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store/v11
          key: ${{ runner.os }}-node-24.19.0-pnpm-11.25.0-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Rehearse the exact npm rollback candidate
        if: ${{ matrix.domain == 'frontend' && github.event_name == 'pull_request' && github.head_ref == 'chore/T67-pnpm-workspace' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          NPM_BASELINE_SHA: 1594128bc84290df3699390643c729ef9d5d6d30
          T67_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          scripts/javascript/run_bounded_benchmark_command.py
          300 10 /dev/stderr t67/rollback --
          bash scripts/javascript/rehearse-npm-rollback.sh
          "$T67_CANDIDATE_SHA" "$NPM_BASELINE_SHA"
      - name: Install verified Mermaid and Chrome for document-engine tests
        if: ${{ matrix.domain == 'document-engines' }}
        env:
          CHROME_SHA256: 878e5ab495b8a694980fca61bc09b37e651ccedce2291c73434d16e48a2646fd
          CHROME_URL: https://dl.google.com/linux/chrome/deb/pool/main/g/google-chrome-stable/google-chrome-stable_151.0.7922.173-1_amd64.deb
          MERMAID_LOCK_SHA256: 6fc7bf6f32bd3f3108c0955e8994c019c04cd9964b9c50472aa28474e9d7e73f
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          set -euo pipefail
          chrome_deb="$RUNNER_TEMP/google-chrome-stable.deb"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --connect-timeout 20 --max-time 180 --retry 3 --retry-all-errors \
            --output "$chrome_deb" "$CHROME_URL"
          echo "$CHROME_SHA256  $chrome_deb" | sha256sum --check --strict
          sudo apt-get install --yes --allow-downgrades "$chrome_deb"
          echo "$MERMAID_LOCK_SHA256  spikes/toolchain/package-lock.json" \
            | sha256sum --check --strict
          npm ci --prefix spikes/toolchain --omit=dev --ignore-scripts
          echo "$GITHUB_WORKSPACE/spikes/toolchain/node_modules/.bin" >> "$GITHUB_PATH"
          test "$(node --version)" = "v22.23.1"
          test "$(spikes/toolchain/node_modules/.bin/mmdc --version)" = "11.16.0"
          test "$(google-chrome-stable --version | awk '{$1=$1; print}')" \
            = "Google Chrome 151.0.7922.173"
      - name: Prepare the RustFS test bucket
        if: ${{ matrix.domain == 'storage-distributed' }}
        run: uv run python -m scripts.ci.prepare_s3_test_bucket
      - name: Install the locked E2E browser driver
        if: ${{ startsWith(matrix.domain, 'e2e-') }}
        run: pnpm install --frozen-lockfile --ignore-scripts --filter md-converter-web-tests
      - name: Run selected domain suite without a shell
        env:
          MARKWEAVE_TOOLCHAIN_CACHE_DIRECTORY: ${{ runner.temp }}/markweave-toolchain
        run: uv run python -m scripts.ci.run_domain "${{ matrix.domain }}"
      - name: Download the accepted T67 package-manager benchmark
        if: ${{ matrix.domain == 'frontend' && github.event_name == 'pull_request' && github.head_ref == 'chore/T67-pnpm-workspace' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-manager-benchmark-33799673333-1
          path: artifacts/package-manager-benchmark
          github-token: ${{ github.token }}
          repository: Guillaume-Lombardo/simple-md-to-docx-converter
          run-id: 33799673333
      - name: Verify the accepted T67 package-manager benchmark
        if: ${{ matrix.domain == 'frontend' && github.event_name == 'pull_request' && github.head_ref == 'chore/T67-pnpm-workspace' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          PNPM_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          bash scripts/javascript/reuse-package-benchmark.sh
          "$PNPM_CANDIDATE_SHA" artifacts/package-manager-benchmark
      - name: Collect the T67 package-manager benchmark
        if: ${{ matrix.domain == 'frontend' && github.event_name == 'workflow_dispatch' && inputs.rerun_t67_benchmark && github.ref == 'refs/heads/chore/T67-pnpm-workspace' }}
        env:
          NPM_BASELINE_SHA: 1594128bc84290df3699390643c729ef9d5d6d30
          PNPM_CANDIDATE_SHA: ${{ github.sha }}
        run: >-
          scripts/javascript/run_bounded_benchmark_command.py
          1620 20 /dev/stderr t67/benchmark --
          bash scripts/javascript/benchmark-package-managers.sh
          "$NPM_BASELINE_SHA" "$PNPM_CANDIDATE_SHA" artifacts/package-manager-benchmark
      - name: Retain the T67 package-manager benchmark
        if: ${{ always() && matrix.domain == 'frontend' && ((github.event_name == 'pull_request' && github.head_ref == 'chore/T67-pnpm-workspace' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.rerun_t67_benchmark && github.ref == 'refs/heads/chore/T67-pnpm-workspace')) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-manager-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/package-manager-benchmark
          if-no-files-found: error
          retention-days: 30
      - name: Retain failed E2E evidence
        if: ${{ failure() && startsWith(matrix.domain, 'e2e-') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure-${{ matrix.domain }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/e2e/${{ matrix.domain == 'e2e-standalone' && 'standalone' || 'distributed' }}
          if-no-files-found: error
          retention-days: 30
      - name: Retain final-image verification evidence
        if: ${{ always() && matrix.domain == 'container' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-image-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/container/sbom.cdx.json
            artifacts/container/sbom.spdx.json
            artifacts/container/vulnerabilities.json
            artifacts/container/image-metadata.json
            artifacts/container-diagnostics/ci-status.txt
            artifacts/container-diagnostics/frontend-oci-identity.txt
            artifacts/container-diagnostics/scanner-readiness.txt
          if-no-files-found: error
          retention-days: 30

  gate:
    name: CI / gate
    if: ${{ always() }}
    needs: [detect, light, domain-plan, heavy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every implemented CI stage
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          DOMAIN_PLAN_RESULT: ${{ needs.domain-plan.result }}
          HEAVY_RESULT: ${{ needs.heavy.result }}
          LIGHT_RESULT: ${{ needs.light.result }}
          RUNNABLE_DOMAINS: ${{ needs.detect.outputs.runnable-domains }}
        run: |
          set -euo pipefail
          [[ "$DETECT_RESULT" == "success" ]]
          [[ "$DOMAIN_PLAN_RESULT" == "success" ]]
          if [[ "$RUNNABLE_DOMAINS" == "[]" ]]; then
            [[ "$HEAVY_RESULT" == "skipped" ]]
          else
            [[ "$HEAVY_RESULT" == "success" ]]
          fi
          [[ "$LIGHT_RESULT" == "success" ]]
