[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "md-converter"
version = "0.1.0"
description = "A service for converting Markdown documents to DOCX and PDF"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=25.1,<26",
    "boto3>=1.40,<2",
    "fastapi>=0.116,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
build = ["hatchling==1.27.0"]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9.0,<10",
    "pytest-cov>=7.0,<8",
    "pytest-mock>=3.15,<4",
    "ruff>=0.13,<1",
    "ty>=0.0.1a20,<1",
]

[tool.uv]
build-constraint-dependencies = [
    "hatchling==1.27.0",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.6.0",
    "trove-classifiers==2026.6.1.19",
]

[tool.hatch.build.targets.sdist]
include = ["/README.md", "/pyproject.toml", "/src/md_converter"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-p",
    "scripts.ci.pytest_branch_coverage",
    "--cov=md_converter",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=json:coverage.json",
    "--cov-fail-under=90",
]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "unit: deterministic tests without external dependencies",
    "functional: application behavior through public interfaces",
    "integration: integration with a real component",
    "e2e: complete flow against the built container",
    "slow: excluded from explicitly fast checks",
    "requires_pandoc: requires Pandoc",
    "requires_mermaid: requires Mermaid CLI and Chromium",
    "requires_libreoffice: requires LibreOffice",
    "requires_postgres: requires PostgreSQL",
    "requires_s3: requires S3-compatible storage",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "PERF",
    "PIE",
    "PL",
    "RET",
    "RUF",
    "S",
    "SIM",
    "TID",
    "UP",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock".msg = "Use the pytest-mock mocker fixture instead."

[tool.ruff.lint.per-file-ignores]
"scripts/ci/check_changed_coverage.py" = ["S603", "S607"]
"scripts/ci/run_domain.py" = ["S603"]
"tests/**/*.py" = ["PLR2004", "S101", "S603", "S607"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "scripts", "tests"]

[tool.coverage.run]
branch = true
source = ["md_converter"]

[tool.coverage.report]
fail_under = 90
show_missing = true
