# Rootless Podman trusted-upstream override, applied after compose.podman.yaml and
# compose.trusted-upstream.yaml. Trusted-upstream mode has no container-to-container
# scanner dependency. Use Podman's rootless user-mode network directly so hosts
# without a working CNI portmap/iptables path can still publish the loopback-only
# evaluation port. The CNI-free browser tier shares the application's slirp4netns
# namespace, and the public router remains the only published listener.
services:
  markweave:
    network_mode: slirp4netns
    networks: !reset []
    ports:
      - "127.0.0.1:${MARKWEAVE_PORT:-8080}:3100"

  frontend:
    network_mode: service:markweave
    networks: !reset []

  router:
    network_mode: service:markweave
    networks: !reset []
    ports: !reset []
    environment:
      BACKEND_ORIGIN: http://127.0.0.1:8080
      FRONTEND_ORIGIN: http://127.0.0.1:3000
      # slirp4netns forwards the host port to the namespace interface, not to
      # the namespace's internal loopback. Host publication remains loopback-only.
      ROUTER_HOST: 0.0.0.0
      ROUTER_PORT: "3100"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3100/login',
          {headers: {Host: process.env.PUBLIC_HOSTS.split(',')[0]}})
          .then(response => process.exit(response.status === 200 ? 0 : 1))
