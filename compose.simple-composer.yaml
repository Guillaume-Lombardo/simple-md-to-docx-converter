# Opt-in Composer setup for a matched, Composer-capable candidate image pair.
volumes:
  markweave-composer-key: {}

networks:
  composer-egress: {}

services:
  markweave:
    networks:
      - composer-egress
    environment:
      MARKWEAVE_COMPOSER_ENABLED: "true"
      MARKWEAVE_COMPOSER_ADMIN_POLICY_DELEGATED: "true"
      MARKWEAVE_COMPOSER_ALLOWED_DESTINATIONS: "[]"
      MARKWEAVE_COMPOSER_ALLOWED_NETWORKS: "[]"
      MARKWEAVE_COMPOSER_SECRET_KEY_PATH: /run/markweave-composer-key/key
      MARKWEAVE_COMPOSER_UPLOAD_MAX_BYTES: "500000"
      MARKWEAVE_COMPOSER_HTTP_REQUEST_MAX_BYTES: "600000"
      MARKWEAVE_COMPOSER_MAXIMUM_REQUEST_BYTES: "65536"
      MARKWEAVE_COMPOSER_MAXIMUM_RESPONSE_BYTES: "262144"
      MARKWEAVE_COMPOSER_MAXIMUM_MODELS: "100"
      MARKWEAVE_COMPOSER_MAXIMUM_ALLOWED_USERS: "100"
      MARKWEAVE_COMPOSER_MAXIMUM_MODEL_NAME_LENGTH: "256"
      MARKWEAVE_COMPOSER_MAXIMUM_CREDENTIAL_BYTES: "16384"
      MARKWEAVE_COMPOSER_MAXIMUM_OUTPUT_TOKENS: "1024"
      MARKWEAVE_COMPOSER_MAXIMUM_CONCURRENT_CALLS: "2"
      MARKWEAVE_COMPOSER_RETRY_AFTER_SECONDS: "3"
      MARKWEAVE_COMPOSER_TIMEOUT_SECONDS: "10"
      MARKWEAVE_COMPOSER_PENDING_PUBLICATION_STALE_SECONDS: "60"
      MARKWEAVE_COMPOSER_DRAFT_RETENTION_SECONDS: "86400"
    volumes:
      - markweave-composer-key:/run/markweave-composer-key:ro
