name: markweave

# Bounded local-evaluation settings. They are intentionally not production sizing.
x-markweave-settings: &markweave-settings
  MD_CONVERTER_INITIAL_ADMIN_USERNAME: admin
  MD_CONVERTER_INITIAL_ADMIN_PASSWORD: "${MARKWEAVE_INITIAL_ADMIN_PASSWORD:?Set MARKWEAVE_INITIAL_ADMIN_PASSWORD before starting Markweave}"
  MD_CONVERTER_SESSION_IDLE_SECONDS: "1800"
  MD_CONVERTER_SESSION_ABSOLUTE_SECONDS: "28800"
  MD_CONVERTER_CONVERSION_UPLOAD_MAX_BYTES: "1000000"
  MD_CONVERTER_CONVERSION_REQUEST_MAX_BYTES: "1100000"
  MD_CONVERTER_CONVERSION_MAX_DECOMPRESSED_BYTES: "2000000"
  MD_CONVERTER_CONVERSION_MAX_FILES: "100"
  MD_CONVERTER_CONVERSION_MAX_IMAGES: "50"
  MD_CONVERTER_CONVERSION_MAX_DIAGRAMS: "20"
  MD_CONVERTER_CONVERSION_MAX_COMPRESSION_RATIO: "200"
  MD_CONVERTER_CONVERSION_IMAGE_MAX_SOURCE_BYTES: "1000000"
  MD_CONVERTER_CONVERSION_IMAGE_MAX_WIDTH_PIXELS: "2000"
  MD_CONVERTER_CONVERSION_IMAGE_MAX_HEIGHT_PIXELS: "2000"
  MD_CONVERTER_CONVERSION_IMAGE_MAX_PIXELS: "4000000"
  MD_CONVERTER_CONVERSION_IMAGE_MAX_SVG_ELEMENTS: "10000"
  MD_CONVERTER_CONVERSION_IMAGE_MAX_SVG_DEPTH: "64"
  MD_CONVERTER_CONVERSION_MERMAID_MAX_SOURCE_BYTES: "100000"
  MD_CONVERTER_CONVERSION_MERMAID_MAX_TOTAL_SOURCE_BYTES: "2000000"
  MD_CONVERTER_CONVERSION_MERMAID_MAX_OUTPUT_BYTES: "1000000"
  MD_CONVERTER_CONVERSION_MERMAID_MAX_TOTAL_OUTPUT_BYTES: "20000000"
  MD_CONVERTER_CONVERSION_MERMAID_MAX_WIDTH_PIXELS: "2000"
  MD_CONVERTER_CONVERSION_MERMAID_MAX_HEIGHT_PIXELS: "2000"
  MD_CONVERTER_CONVERSION_MERMAID_EXECUTABLE: mmdc
  MD_CONVERTER_CONVERSION_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome-stable
  MD_CONVERTER_CONVERSION_PDF_CANCELLATION_POLL_SECONDS: "0.1"
  MD_CONVERTER_CONVERSION_PDF_MAX_BYTES: "20000000"
  MD_CONVERTER_CONVERSION_PDF_MAX_DECODED_STREAM_BYTES: "20000000"
  MD_CONVERTER_CONVERSION_PDF_MAX_PAGES: "5"
  MD_CONVERTER_CONVERSION_PDF_MAX_OBJECTS: "100000"
  MD_CONVERTER_CONVERSION_PDF_MAX_OBJECT_DEPTH: "100"
  MD_CONVERTER_CONVERSION_FONT_MANIFEST_PATH: /opt/md-converter/font-manifest.json
  MD_CONVERTER_CONVERSION_RETRY_AFTER_SECONDS: "1"
  MD_CONVERTER_JOB_RESULT_RETENTION_SECONDS: "60"
  MD_CONVERTER_JOB_ACTIVE_LIMIT_PER_USER: "8"
  MD_CONVERTER_JOB_GLOBAL_QUEUE_CAPACITY: "24"
  MD_CONVERTER_JOB_MAX_DURATION_SECONDS: "90"
  MD_CONVERTER_WORKER_MEMORY_BUDGET_BYTES: "805306368"
  MD_CONVERTER_WORKER_EPHEMERAL_STORAGE_BUDGET_BYTES: "268435456"
  MD_CONVERTER_WORKER_LEASE_SECONDS: "6"
  MD_CONVERTER_WORKER_HEARTBEAT_SECONDS: "1"
  MD_CONVERTER_WORKER_INCOMPLETE_SUBMISSION_SECONDS: "60"
  MD_CONVERTER_WORKER_IDLE_POLL_SECONDS: "0.1"
  MD_CONVERTER_WORKER_ERROR_BACKOFF_SECONDS: "0.25"
  MD_CONVERTER_WORKER_CLEANUP_INTERVAL_SECONDS: "1"
  MD_CONVERTER_WORKER_CLEANUP_BATCH_SIZE: "100"
  MD_CONVERTER_TEMPLATE_MAX_ARCHIVE_BYTES: "1000000"
  MD_CONVERTER_TEMPLATE_REQUEST_MAX_BYTES: "1100000"
  MD_CONVERTER_TEMPLATE_METADATA_REQUEST_MAX_BYTES: "4096"
  MD_CONVERTER_TEMPLATE_MAX_NAME_CHARACTERS: "100"
  MD_CONVERTER_TEMPLATE_MAX_DESCRIPTION_CHARACTERS: "1000"
  MD_CONVERTER_TEMPLATE_MAX_ENTRIES: "2000"
  MD_CONVERTER_TEMPLATE_MAX_MEMBER_BYTES: "1000000"
  MD_CONVERTER_TEMPLATE_MAX_TOTAL_BYTES: "2000000"
  MD_CONVERTER_TEMPLATE_MAX_COMPRESSION_RATIO: "200"
  MD_CONVERTER_TEMPLATE_MAX_XML_ELEMENTS: "250000"
  MD_CONVERTER_TEMPLATE_MAX_XML_DEPTH: "100"
  MD_CONVERTER_TEMPLATE_MAX_XML_ATTRIBUTES: "500000"
  MD_CONVERTER_TEMPLATE_MAX_DECLARED_FONTS: "64"
  MD_CONVERTER_TEMPLATE_MAX_FONT_NAME_CHARACTERS: "128"
  MD_CONVERTER_TEMPLATE_PANDOC_EXECUTABLE: pandoc
  MD_CONVERTER_TEMPLATE_LIBREOFFICE_EXECUTABLE: soffice
  MD_CONVERTER_TEMPLATE_ENGINE_TIMEOUT_SECONDS: "15"
  MD_CONVERTER_TEMPLATE_ENGINE_TERMINATION_GRACE_SECONDS: "1"
  MD_CONVERTER_TEMPLATE_PENDING_PUBLICATION_STALE_SECONDS: "60"
  MD_CONVERTER_READINESS_TIMEOUT_SECONDS: "2"
  MD_CONVERTER_CLAMAV_HOST: clamav
  MD_CONVERTER_CLAMAV_PORT: "3310"
  MD_CONVERTER_CLAMAV_TIMEOUT_SECONDS: "5"
  MD_CONVERTER_STORAGE_PROFILE: standalone
  MD_CONVERTER_STANDALONE_DATA_DIRECTORY: /data

services:
  markweave:
    image: ghcr.io/guillaume-lombardo/md-converter:0.3.0@sha256:4a16b311affb0d0a839350bd145810c1f6044cc7347d12ecd9263fe894de217d
    platform: linux/amd64
    command: embedded-worker
    restart: unless-stopped
    depends_on:
      clamav:
        condition: service_healthy
    environment: *markweave-settings
    ports:
      - "127.0.0.1:${MARKWEAVE_PORT:-8080}:8080"
    networks:
      - scanner
      - frontend
    volumes:
      - markweave-data:/data
      # 320 MiB disk-backed filesystem; the application budget below remains 256 MiB.
      - markweave-work:/work
    read_only: true
    user: "1001:0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./spikes/toolchain/chrome-seccomp.json
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    shm_size: 128m
    # 768 MiB worker budget plus bounded /tmp, /dev/shm, and process headroom.
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  clamav:
    image: docker.io/clamav/clamav-debian:1.4_base@sha256:c01d064057453645c5992105ef7958155afc462f87eec6894d475168f18d3c0b
    platform: linux/amd64
    restart: unless-stopped
    networks:
      - scanner
      - signature-updates
    volumes:
      - clamav-signatures:/var/lib/clamav
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      # The official init changes ownership, then clamd/freshclam drop to user clamav.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run:rw,nosuid,nodev,noexec,size=8m
      - /tmp:rw,nosuid,nodev,noexec,size=64m
      - /var/lock:rw,nosuid,nodev,noexec,size=1m
      - /var/log/clamav:rw,nosuid,nodev,noexec,size=32m,mode=0750,uid=1000,gid=1000
    mem_limit: 4g
    cpus: 2
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/clamdcheck.sh
      interval: 10s
      timeout: 5s
      retries: 180
      start_period: 30s

networks:
  scanner:
    internal: true
  frontend:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  signature-updates: {}

volumes:
  markweave-data: {}
  markweave-work:
    driver: local
    driver_opts:
      type: ext4
      device: "${MARKWEAVE_WORK_DEVICE:?Run scripts/quickstart.sh up}"
      o: rw,nosuid,nodev
  clamav-signatures: {}
